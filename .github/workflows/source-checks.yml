name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/fixtures/rolldown-native-probe --ignore-scripts --no-audit --no-fund
      # These are source and packaging checks, not browser or native-build acceptance.
      - name: Check source snapshots and package setup
        run: |
          node --test --test-concurrency=1 \
            tests/source-snapshot.test.mjs \
            tests/sdk-package-metadata.test.mjs \
            tests/sdk-package-source-binding.test.mjs \
            tests/sdk-compiler-package-boundary.test.mjs \
            tests/sdk-parser-adapter.test.mjs \
            tests/compiler-assets.test.mjs \
            tests/sdk-external-assets.test.mjs \
            tests/runtime-package-setup.test.mjs \
            tests/sdk-split-adoption.test.mjs
