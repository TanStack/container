name: Native SDK checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install locked native build inputs and browsers
        run: |
          npm install --global npm@11.12.1
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/fixtures/native-runtime-832 --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/fixtures/native-oxide-build --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/fixtures/wasi-filesystem-codec-114 --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - run: npm run test:release
      - run: npm run test:native-site-harness
      - run: node scripts/setup-release-toolchains.mjs
      - name: Build private SDK and check its installed desktop workflows
        run: node scripts/check-native-sdk.mjs
      # Do not upload unreviewed runtime assets or unpublished tarballs.
      - name: Retain functional check metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-sdk-check-${{ github.sha }}
          path: test-results/native-sdk-check.json
          if-no-files-found: ignore
